<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>考研每日一句</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="./favicon.svg" />
<meta name="color-scheme" content="light dark" />
<script>
// 在绘制页面前恢复配色，避免夜间模式闪白。
try {
  const theme = localStorage.getItem('kaoyan-theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
} catch (_) { /* 存储不可用时跟随系统配色。 */ }
</script>

<style>
/* ============================================================
   字体：霞鹜文楷（LXGW WenKai）
   把字体文件放到 ./fonts/ 目录下即可生效
   ============================================================ */
@font-face{
  font-family: 'LXGW WenKai';
  src: /*url('./fonts/LXGWWenKai-Regular.woff2') format('woff2'),*/
       url('./fonts/LXGWWenKai-Regular.ttf')   format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root{
  --ink:        #3b332e;
  --ink-soft:   #8a7c71;
  --ink-faint:  rgba(138,124,113,.7);
  --accent:     #b07d4e;
  --card:       rgba(255,253,250,.80);
  --paper:      #faf6f0;
  --glow:       #fff9f0;
  --shade:      #f2e7d8;
  color-scheme: light;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink: #eadfd2; --ink-soft: #c4b3a2; --ink-faint: #b7a693;
    --accent: #d5a679; --card: rgba(43,37,32,.94);
    --paper: #211c18; --glow: #352b23; --shade: #302820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink: #eadfd2; --ink-soft: #c4b3a2; --ink-faint: #b7a693;
  --accent: #d5a679; --card: rgba(43,37,32,.94);
  --paper: #211c18; --glow: #352b23; --shade: #302820;
  color-scheme: dark;
}

*{ box-sizing: border-box; }

html{ min-height:100%; }

body{
  margin:0;
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 84px 20px 76px;
  background:
    radial-gradient(1100px 600px at 12% -12%, var(--glow) 0%, transparent 62%),
    radial-gradient(900px 520px at 112% 112%, var(--shade) 0%, transparent 58%),
    var(--paper);
  color: var(--ink);
  font-family: 'LXGW WenKai', '霞鹜文楷', 'Noto Serif SC', 'Source Han Serif SC',
               'Songti SC', 'STSong', 'SimSun', serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height:100vh;
}

/* ---------- 页面标识 ---------- */
.site-brand{
  position:absolute; top:24px; left:clamp(20px, 3vw, 36px);
  display:flex; align-items:center; gap:10px;
  color:var(--ink-soft); font-size:17px; letter-spacing:.08em;
  line-height:1.4; white-space:nowrap;
}
.site-brand svg{ width:34px; height:34px; flex-shrink:0; color:var(--accent); }

/* ---------- 卡片 ---------- */
.card{
  position: relative;
  width: min(660px, 100%);
  padding: clamp(34px, 6vw, 60px) clamp(24px, 5.5vw, 56px) clamp(28px, 4.5vw, 44px);
  background: var(--card);
  border: 1px solid rgba(176,125,78,.18);
  border-radius: 24px;
  text-align: center;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow:
    0 24px 60px -28px rgba(120, 90, 60, .45),
    0 2px 4px rgba(120, 90, 60, .05),
    inset 0 1px 0 rgba(255,255,255,.9);
  animation: rise .9s cubic-bezier(.16,.84,.32,1) both;
}

.card::before{
  content:'';
  position:absolute;
  top:-1px; left:14%; right:14%;
  height:2px;
  border-radius:2px;
  background: linear-gradient(90deg, transparent, rgba(176,125,78,.55), transparent);
}

@keyframes rise{
  from{ opacity:0; transform: translateY(14px) scale(.985); }
  to  { opacity:1; transform: none; }
}

/* ---------- 日期 ---------- */
.eyebrow{
  margin: 0 0 12px;
  font-size: 13px;
  letter-spacing: .55em;
  text-indent: .55em;
  color: var(--ink-soft);
}

.date{
  margin: 0;
  font-size: clamp(30px, 7vw, 46px);
  line-height: 1.12;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

/* ---------- 分隔线 ---------- */
.rule{
  position: relative;
  width: 120px;
  height: 1px;
  margin: 26px auto 30px;
  background: linear-gradient(90deg, transparent, rgba(176,125,78,.55), transparent);
}
.rule::after{
  content:'';
  position:absolute; left:50%; top:50%;
  width:5px; height:5px;
  background: var(--accent);
  opacity:.75;
  transform: translate(-50%,-50%) rotate(45deg);
}

/* ---------- 句子 ---------- */
.sentence{
  margin: 0;
  font-size: clamp(18px, 4.4vw, 24px);
  line-height: 2.05;
  letter-spacing: .045em;
  color: var(--ink);
  word-break: break-word;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .8s ease, transform .8s cubic-bezier(.2,.7,.3,1);
}
.sentence.show{ opacity:1; transform:none; }

.sentence.muted{
  font-size: clamp(15px, 3.4vw, 18px);
  letter-spacing: .12em;
  color: var(--ink-faint);
}

/* ---------- 底部小字 ---------- */
.meta{
  margin-top: 26px;
  min-height: 1em;
  font-size: 12.5px;
  letter-spacing: .22em;
  text-indent: .22em;
  color: var(--ink-faint);
}

/* ---------- 阅读配色与往期回看 ---------- */
.toolbar{ display:flex; justify-content:flex-end; align-items:center; gap:12px; margin: -12px 0 20px; }
.repo-link{
  position:fixed; bottom:16px; left:20px; z-index:2;
  display:inline-flex; align-items:center; gap:6px;
  color:var(--ink-soft); font-size:14px; text-decoration:none; padding:8px 0;
}
.repo-link:hover{ color:var(--accent); }
.repo-link svg{ width:18px; height:18px; flex-shrink:0; fill:currentColor; }
.theme-toggle{
  font: inherit; font-size:14px; color:var(--ink-soft);
  background:transparent; border:1px solid rgba(176,125,78,.3);
  border-radius:999px; padding:8px 14px; cursor:pointer;
}
.theme-toggle:hover{ color:var(--ink); background:var(--paper); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:5px; }
.archive{ margin-top:32px; border-top:1px solid rgba(176,125,78,.22); text-align:left; }
.archive summary{ padding:20px 0 4px; cursor:pointer; color:var(--ink-soft); font-size:16px; }
.archive summary::marker{ color:var(--accent); }
.archive-count{ font-size:13px; margin-left:8px; }
.archive-note{ font-size:13px; color:var(--ink-soft); line-height:1.8; }
.archive-list{ list-style:none; padding:0; margin:0; max-height: min(55vh, 480px); overflow-y:auto; overscroll-behavior:contain; }
.archive-item{ padding:20px 4px; border-top:1px solid rgba(176,125,78,.16); }
.archive-item time{ font-size:13px; color:var(--accent); font-variant-numeric:tabular-nums; }
.archive-item p{ margin:8px 0 0; font-size:17px; line-height:1.9; overflow-wrap:anywhere; }
.archive-status{ color:var(--ink-soft); font-size:14px; line-height:1.8; }
.date-trigger{ font:inherit; color:inherit; letter-spacing:inherit; background:none; border:0; padding:0; cursor:default; }
.countdown{ margin:20px 0 0; }
.countdown-label{ margin:0 0 8px; font-size:12px; color:var(--ink-soft); letter-spacing:.08em; }
.countdown-value{ margin:0; color:var(--accent); font-size:clamp(19px, 4.5vw, 24px); font-variant-numeric:tabular-nums; white-space:nowrap; }
.countdown-value small{ font-size:12px; margin:0 8px 0 3px; color:var(--ink-soft); }
.countdown-value small:last-child{ margin-right:0; }
.clock-status{ display:block; margin-top:8px; font-size:11px; color:var(--ink-faint); }
.dev-panel{ width:min(420px, calc(100% - 32px)); padding:26px; border:1px solid var(--accent); border-radius:20px; background:var(--paper); color:var(--ink); font:inherit; box-shadow:0 20px 70px rgba(0,0,0,.2); }
.dev-panel::backdrop{ background:rgba(30,25,20,.35); backdrop-filter:blur(3px); }
.dev-panel h2{ margin:0 0 16px; font-size:22px; }
.dev-panel p{ font-size:14px; line-height:1.8; color:var(--ink-soft); }
.dev-panel label{ display:block; font-size:14px; margin-bottom:8px; }
.dev-panel input{ width:100%; min-width:0; padding:10px; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--ink-faint); border-radius:8px; }
.dev-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:18px; }
.dev-feedback{ min-height:1.8em; }
@media (prefers-reduced-motion: reduce){
  .card{ animation:none; }
  .sentence{ transition:none; }
}

@media (max-width: 480px){
  .card{ border-radius: 20px; }
  .sentence{ line-height: 1.95; }
}
</style>
</head>

  <header class="site-brand">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">

      <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.14c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.16 1.18A11.02 11.02 0 0 1 12 6.03c.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.18 3.16-1.18.62 1.59.23 2.76.11 3.05.73.81 1.18 1.84 1.18 3.09 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14v3.16c0 .31.21.67.79.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>

  <main class="card">
    <div class="toolbar">

<script>
(function () {
  'use strict';

  /* 数据文件（相对路径，部署到 GitHub Pages 时与 index.html 同级） */
  const DATA_URL = './考研每日一句_83天_Base64.txt';
  const LEGACY_DATA_URL = './考研每日一句_古早版.txt';
  const CURRENT_START = '2026-09-29';
  const dataLoads = new Map();

  const pad2 = n => String(n).padStart(2, '0');

  const TIME_API = 'https://utctime.app/api/now';
  const EXAM_TIME = Date.parse('2026-12-19T08:30:00+08:00');
  const SYNC_INTERVAL = 10 * 60 * 1000;
  const BEIJING_OFFSET = 8 * 60 * 60 * 1000;

  /* 显示、数据匹配和手动输入统一使用北京时间，不受设备时区影响。 */
  function localDateKey(d) {
    const bj = new Date(d.getTime() + BEIJING_OFFSET);
    return bj.getUTCFullYear() + '-' + pad2(bj.getUTCMonth() + 1) + '-' + pad2(bj.getUTCDate());
  }

  /* Base64(UTF-8) → 中文 */
  function decodeBase64Utf8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const dateEl     = document.getElementById('date');
  const sentenceEl = document.getElementById('sentence');
  const metaEl     = document.getElementById('meta');
  const archiveEl = document.getElementById('archive');
  const archiveCountEl = document.getElementById('archive-count');
  const archiveStatusEl = document.getElementById('archive-status');
  const archiveListEl = document.getElementById('archive-list');
  const themeToggleEl = document.getElementById('theme-toggle');
  const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');

  function isDark() {
    const theme = document.documentElement.dataset.theme;
    return theme ? theme === 'dark' : systemTheme.matches;
  }
  function updateThemeButton() {
    const dark = isDark();
    themeToggleEl.textContent = dark ? '日间阅读' : '夜间阅读';
    themeToggleEl.setAttribute('aria-pressed', String(dark));
  }
  themeToggleEl.addEventListener('click', () => {
    const theme = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('kaoyan-theme', theme); } catch (_) { /* 仍可切换当前页面。 */ }
    updateThemeButton();
  });
  systemTheme.addEventListener('change', updateThemeButton);
  updateThemeButton();

  const countdownEl = document.getElementById('countdown');
  const countdownLabelEl = document.getElementById('countdown-label');
  const clockStatusEl = document.getElementById('clock-status');
  const devPanel = document.getElementById('dev-panel');
  const devTime = document.getElementById('dev-time');
  const devFeedback = document.getElementById('dev-feedback');
  let networkClock = null;
  let simulatedClock = null;
  let syncPending = false;
  let lastSyncAttempt = -Infinity;
  let syncFailed = false;
  let key = '';
  let entries = null;
  let sourceErrors = new Set();
  let contentLoad = 0;

  function clockNow() {
    const anchor = simulatedClock || networkClock;
    return anchor ? anchor.time + performance.now() - anchor.tick : Date.now();
  }

  function updateClock() {
    const now = clockNow();
    const nextKey = localDateKey(new Date(now));
    if (nextKey !== key) {
      key = nextKey;
      dateEl.textContent = key.startsWith('2026-') ? key.slice(5) : key;
      loadContentForDate();
    }
    const seconds = Math.max(0, Math.ceil((EXAM_TIME - now) / 1000));
    const values = [Math.floor(seconds / 86400), Math.floor(seconds / 3600) % 24,
      Math.floor(seconds / 60) % 60, seconds % 60];
    const countdownHTML = values.map((value, i) => pad2(value) + '<small>' + ['天', '时', '分', '秒'][i] + '</small>').join('');
    if (countdownEl.innerHTML !== countdownHTML) countdownEl.innerHTML = countdownHTML;
    countdownLabelEl.textContent = now >= EXAM_TIME ? '目标时间已到 · 愿你从容落笔' : '距 12 月 19 日 08:30';
    clockStatusEl.textContent = '北京时间 · ' + (simulatedClock ? '模拟时间' : networkClock
      ? (syncFailed ? '网络校时保持中' : '已网络校时') : '本地时间');
    clockStatusEl.title = simulatedClock ? '开发者模式：使用手动设置的时间' : networkClock
      ? 'UTCTime 网络校时；每 10 分钟重新同步' : '网络时间不可用或正在校时，使用设备时间作为保障';
  }

  async function syncClock(force = false) {
    if (syncPending || (!force && performance.now() - lastSyncAttempt < SYNC_INTERVAL)) return;
    syncPending = true;
    lastSyncAttempt = performance.now();
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const start = performance.now();
    try {
      const response = await fetch(TIME_API, { cache:'no-store', credentials:'omit', signal:controller.signal });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const data = await response.json();
      const end = performance.now();
      if (!Number.isSafeInteger(data.unix_ms) || data.unix_ms < Date.UTC(2020, 0, 1)
          || data.unix_ms > Date.UTC(2101, 0, 1) || end - start > 5000) throw new Error('无效的时间响应');
      // 近似补偿单程延迟；之后用单调时钟走动，避免设备改时造成跳变。
      networkClock = { time:data.unix_ms + (end - start) / 2, tick:end };
      syncFailed = false;
    } catch (_) {
      // 初次失败使用本地时间；已有网络锚点时继续走动，保留上次校时结果。
      syncFailed = true;
    } finally {
      clearTimeout(timeout);
      syncPending = false;
      updateClock();
    }
  }

  function openDeveloper() {
    if (devPanel.open) return;
    devTime.value = new Date(clockNow() + BEIJING_OFFSET).toISOString().slice(0, 19);
    devFeedback.textContent = simulatedClock ? '当前正在使用模拟时间。' : '';
    devPanel.showModal();
  }
  let dateClicks = [];
  dateEl.addEventListener('click', () => {
    const tick = performance.now();
    dateClicks = dateClicks.filter(value => tick - value < 2500);
    dateClicks.push(tick);
    if (dateClicks.length >= 5) { dateClicks = []; openDeveloper(); }
  });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey && event.altKey && event.code === 'KeyD' && !event.repeat) {
      event.preventDefault();
      openDeveloper();
    }
  });
  document.getElementById('dev-form').addEventListener('submit', event => {
    event.preventDefault();
    const value = devTime.value;
    const fullValue = value.length === 16 ? value + ':00' : value;
    const time = Date.parse(fullValue + '+08:00');
    if (!Number.isFinite(time) || new Date(time + BEIJING_OFFSET).toISOString().slice(0, 19) !== fullValue) {
      devFeedback.textContent = '请输入有效的日期和时间。';
      return;
    }
    simulatedClock = { time, tick:performance.now() };
    updateClock();
    devFeedback.textContent = '已应用模拟时间，收起面板后可查看页面。';
  });
  document.getElementById('dev-close').addEventListener('click', () => devPanel.close());
  document.getElementById('dev-reset').addEventListener('click', () => {
    simulatedClock = null;
    updateClock();
    devPanel.close();
    syncClock(true);
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { updateClock(); syncClock(); }
  });
  window.addEventListener('online', () => syncClock(true));

  function render(text, meta, muted) {
    sentenceEl.textContent = text;
    metaEl.textContent = meta || '';
    sentenceEl.classList.toggle('muted', !!muted);
    requestAnimationFrame(() => sentenceEl.classList.add('show'));
  }

  let pastEntries = [];
  let archiveReady = false;
  let archiveRendered = false;
  function entryText(entry) {
    return entry.text !== undefined ? entry.text : decodeBase64Utf8(entry.b64);
  }
  function renderArchive() {
    if (!archiveReady || archiveRendered || !archiveEl.open) return;
    archiveRendered = true;
    const fragment = document.createDocumentFragment();
    for (const entry of pastEntries) {
      const item = document.createElement('li');
      item.className = 'archive-item';
      const date = document.createElement('time');
      date.dateTime = entry.date;
      date.textContent = entry.date;
      const sentence = document.createElement('p');
      try { sentence.textContent = entryText(entry); }
      catch (_) { sentence.textContent = '这一天的内容暂时无法解码。'; }
      item.append(date, sentence);
      fragment.append(item);
    }
    archiveListEl.append(fragment);
  }
  archiveEl.addEventListener('toggle', renderArchive);

  function updateContent() {
    const hit = entries.get(key);
    pastEntries = Array.from(entries.values())
      .filter(entry => entry.date < key)
      .sort((a, b) => b.date.localeCompare(a.date));
    archiveReady = true;
    archiveRendered = false;
    archiveListEl.replaceChildren();
    archiveCountEl.textContent = '· ' + pastEntries.length + ' 句';
    archiveStatusEl.textContent = sourceErrors.size
      ? '部分往期内容加载失败，请刷新页面重试。'
      : pastEntries.length ? '' : '还没有往期句子，明天再来看看吧。';
    archiveStatusEl.hidden = !sourceErrors.size && pastEntries.length > 0;
    renderArchive();
    const todaySource = key < CURRENT_START ? LEGACY_DATA_URL : DATA_URL;
    if (sourceErrors.has(todaySource)) {
      render('数据加载失败，请稍后再试', '', true);
      return;
    }
    if (!hit) {
      render('不在2027考研初试备考时间', '', true);
      return;
    }
    try { render(entryText(hit), '每日一句', false); }
    catch (_) { render('今日内容解码失败', '', true); }
  }

  function loadDataSource(url) {
    if (dataLoads.has(url)) return dataLoads.get(url);
    const load = (async () => {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const raw = await res.text();
      const records = new Map();
      const legacy = url === LEGACY_DATA_URL;
      for (const line of raw.split(/\r?\n/)) {
        // 只切开日期和编号，保留明文句子中可能出现的空格。
        const match = line.trim().match(/^(\d{4}-\d{2}-\d{2})\s+\d+\s+(.+)$/);
        if (!match) continue;
        const [, date, value] = match;
        // 两份文件各自负责一段日期，边界由日期决定，与编号无关。
        if (legacy ? date < '2026-01-01' || date >= CURRENT_START : date < CURRENT_START) continue;
        records.set(date, legacy ? { date, text:value } : { date, b64:value });
      }
      return records;
    })();
    dataLoads.set(url, load);
    // 失败时允许下次切换日期重新加载；已成功的数据无需重复请求。
    load.catch(() => dataLoads.delete(url));
    return load;
  }

  async function loadContentForDate() {
    const request = ++contentLoad;
    // 早期日期只读取古早版，不依赖之后的编码版是否可用。
    const sources = key < CURRENT_START ? [LEGACY_DATA_URL] : [LEGACY_DATA_URL, DATA_URL];
    entries = null;
    archiveReady = false;
    archiveRendered = false;
    archiveListEl.replaceChildren();
    archiveCountEl.textContent = '';
    archiveStatusEl.hidden = false;
    archiveStatusEl.textContent = '正在载入往期内容…';
    render('正在载入…', '', false);
    const results = await Promise.allSettled(sources.map(loadDataSource));
    // 模拟时间或网络校时切换日期后，忽略较早请求的结果。
    if (request !== contentLoad) return;
    entries = new Map();
    sourceErrors = new Set();
    results.forEach((result, i) => {
      if (result.status === 'fulfilled') {
        for (const [date, entry] of result.value) entries.set(date, entry);
      } else {
        sourceErrors.add(sources[i]);
        console.error(result.reason);
      }
    });
    updateContent();
  }

  updateClock();
  syncClock();
  // 每次根据绝对时间重算，不累减计数，后台节流后也能立即追上。
  setInterval(() => { updateClock(); if (!document.hidden) syncClock(); }, 250);
})();
</script>
